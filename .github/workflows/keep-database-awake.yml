# Supabase's free plan pauses a project after about a week with no activity, which would make
# the map and Neighborhood pages look broken. This asks the database for one row twice a week.
# Run it by hand any time: GitHub > Actions > "Keep database awake" > Run workflow.
name: Keep database awake

on:
  schedule:
    - cron: "17 8 * * 1,4"   # Mondays and Thursdays
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Read the public connection values from config.js
        id: cfg
        run: |
          url=$(grep -oP 'supabaseUrl:\s*"\K[^"]+' config.js)
          key=$(grep -oP 'supabaseKey:\s*"\K[^"]+' config.js)
          if [ -z "$url" ] || [ -z "$key" ]; then echo "config.js has no Supabase values"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Ask the database for one row
        env:
          SUPABASE_URL: ${{ steps.cfg.outputs.url }}
          SUPABASE_KEY: ${{ steps.cfg.outputs.key }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/public_reports?select=id&limit=1")
          echo "Database answered with HTTP $code"
          test "$code" = "200"
